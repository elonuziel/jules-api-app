name: Build Android APK & Publish Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            bun run cap:add:android
          fi

      - name: Sync Capacitor
        run: bun run cap:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK Artifacts
        id: prepare-apk
        run: |
          VERSION_TAG="v1.0.${{ github.run_number }}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          
          # Copy to friendly named APKs
          cp android/app/build/outputs/apk/debug/app-debug.apk "jules-console-${VERSION_TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "jules-console-latest.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jules-app-debug-apk
          path: |
            jules-console-*.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare-apk.outputs.version_tag }}
          name: Release ${{ steps.prepare-apk.outputs.version_tag }}
          body: |
            ## Jules Console ${{ steps.prepare-apk.outputs.version_tag }}
            
            ### 📱 Download Android APK
            - [**Direct Download: jules-console-${{ steps.prepare-apk.outputs.version_tag }}.apk**](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare-apk.outputs.version_tag }}/jules-console-${{ steps.prepare-apk.outputs.version_tag }}.apk)
            - [**Latest APK: jules-console-latest.apk**](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare-apk.outputs.version_tag }}/jules-console-latest.apk)
            
            ### 🚀 Installation Instructions
            1. Download the APK directly on your Android device.
            2. Open the downloaded `.apk` file.
            3. If prompted, enable *"Install unknown apps"* for your browser / file manager.
            4. Enjoy managing Jules from your phone!
          files: |
            jules-console-${{ steps.prepare-apk.outputs.version_tag }}.apk
            jules-console-latest.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
